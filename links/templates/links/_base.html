{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" class="bg-gray-50">
<head>
  <meta charset="UTF-8">
  <title>Link.ly</title>
    {% tailwind_css %}
</head>
<body class="">
<header class="text-gay-600 body-font border-b mb-8">
    <div class="container mx-auto flex flex-wrap pw-10 py-5 flex-col md:flex-row items-center">
        <a href="{% url 'home' %}" class="flex title-font font-medium items-center text-gray-900 mb-4 md:mb-0">
            <span class="ml-5 text-xl">Link.ly</span>
        </a>
        <nav class="md:mr-auto md:ml-4 md:py-1 md:pl-4 md:border-1 md:border-gray-400 flex flex-wrap items-center text-base justify-center">

        </nav>
        <a href="{% url 'create-link' %}">
            <button class="inline-flex items-center bg-blue-100 border-0 py-2 px-1 mx-3 focus:outline-none border-blue-200 rounded text-base mt-4 md:mt-0">

            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="24" height="24" viewBox="0 0 24 24">
<path fill-rule="evenodd" d="M 11 2 L 11 11 L 2 11 L 2 13 L 11 13 L 11 22 L 13 22 L 13 13 L 22 13 L 22 11 L 13 11 L 13 2 Z"></path>
</svg>
        </button>
        </a>
    </div>
</header>
<div>
    {% block content %}
    {% endblock content %}
</div>
</body>
</html>
