{# load static tailwind_tags #}
{% load static %}
{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="en">
	<head>
    <title>Django Tailwind</title>
		<meta charset="UTF-8">
        {% bootstrap_css %}
        {% bootstrap_javascript %}
	</head>

	<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="ms-auto">
        {% if user.is_authenticated %}
            <a href="{% url 'note.list' %}" class="btn btn-outline-light me-1">Home</a>
            <a href="{% url 'note.new' %}" class="btn btn-outline-light me-1">Create</a>
            <a href="{% url 'logout' %}" class="btn btn-outline-light me-1">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light me-1">Login</a>
            <a href="{% url 'signup' %}" class="btn btn-outline-light me-1">Signup</a>
        </div>
        {% endif %}
    </nav>
    <div class="my-5 text-center container">
        {% block content %}
        {% endblock %}
    </div>
	</body>
</html>
